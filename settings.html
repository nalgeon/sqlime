<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sqlime / Settings</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)">

    <link rel="icon" href="/img/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

    <link rel="stylesheet" href="css/article.css">
</head>

<body>
    <header>
        <h1>Settings</h1>
    </header>
    <main>
        <article>
            <p>All settings are optional, you can use Sqlime without them.</p>
            <form id="settings">
                <fieldset>
                    <legend>GitHub credentials (to enable sharing)</legend>
                    <label for="github-username">Username</label>
                    <input id="github-username" type="text">
                    <label for="github-token">API token</label>
                    <input id="github-token" type="text">
                    <p>
                        This is <strong>not</strong> your GitHub password.
                        Create an API token with a 'gist' scope in the
                        <a href="https://github.com/settings/tokens" target="_blank">GitHub settings</a>
                    </p>
                </fieldset>
            </form>
            <p><a href="javascript:history.go(-1)">← back</a></p>
        </article>
    </main>
    <script type="module" src="js/settings.js"></script>
</body>

</html>
